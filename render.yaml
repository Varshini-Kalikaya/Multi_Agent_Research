services:
  # ==============================================================================
  # Backend Web Service (Node.js / Express / Socket.IO)
  # ==============================================================================
  - type: web
    name: multi-agent-research-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: SEARCH_PROVIDER
        value: tavily
      - key: TAVILY_API_KEY
        sync: false

  # ==============================================================================
  # Frontend Static Site (React / Vite)
  # ==============================================================================
  - type: web
    name: multi-agent-research-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: multi-agent-research-backend
          property: host
